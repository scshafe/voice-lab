# Project intent (BASE-01). The schema is illustrative until M2/M7 fix it.
schema_version = 1

[project]
id = "voice-journey"
class = "managed"

# A deployed application that is not (yet) an scshafe-app: it graduates to
# the app kind (class "scshafe-app") when M0 migrates it.
[app]
kind = "service"

# BASE-06: the one command that verifies this repository, run from its root
# by .github/workflows/ci.yml and by hand on the checkout under review. Keep
# the two equal.
[verify]
command = "npm test"

# DEPLOY-01: how this project reaches production (references, never secrets).
# The runner lane: a merge to main runs .github/workflows/deploy.yml, which
# verifies on a GitHub-hosted runner and deploys through the laptop's
# entrypoint (runner laptop-voice-journey-prod); the stack is app-owned
# (deploy/stack/), behind its Pocket ID door. Infra's
# stacks/voice-journey/host.conf grants the data root binds and the vj-mirror
# group.
[deploy]
lane = "runner"
stack = "voice-journey"
layout = "app"
host = "laptop"
tailnet_node = "voice-journey"
door = "pocket-id"
verify_on = "hosted"

[skills]
# BASE-05 asks for .agents/skills; the catalog is M4. Recorded gap.
selected = []

# Adopted, not generated (D-6): `dev adopt --add-missing` added this file to
# an existing service on 2026-10-02. It records which scshafe-dev standard the
# repository was adopted under; it does not claim scshafe-dev rendered this
# repository's files, and the ones that existed were left as they are.
[template]
source = "scshafe/scshafe-dev"
version = "0.10.2"
commit = "6b82460e19d8269ccdb85e74cae31a6c88e3baaf"
released = true
dirty = false
mode = "adopted"
params = { kind = "service", name = "voice-journey", date = "2026-10-02" }

# IDENT-01: what this project's agent may do (scshafe/infra docs/platform/agent-identity.md).
# References, never secrets. `dev identity plan` compares it with the host and GitHub.
[identity]
agent = "agent-voice-journey"
github = ["contents=write", "pull_requests=write", "issues=write", "workflows=write", "actions=write"]
# web/ installs the private @scshafe/ui from GitHub Packages (IDENT-02).
packages = "read"
# The image build (Dockerfile) needs docker; the build also takes the package token as a BuildKit secret.
docker = true
