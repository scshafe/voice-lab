name: CI

# BASE-04. Generated by scshafe-dev (the tool kind; the version is recorded in
# dev.toml [template], not here, so a release does not touch this file); hosted
# runners only, actions pinned by SHA. The verification is dev.toml [verify]
# command (BASE-06): keep the two equal.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the oldest Python the standard supports (tomllib); 3.14 is
        # the Arch host's.
        python: ["3.11", "3.14"]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-python v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - name: Verify (dev.toml [verify] command)
        run: |
          scripts/verify
      # TOOL-01: every tracked shell script (*.sh, or a sh/bash shebang) must
      # parse (bash -n) and pass shellcheck (preinstalled on ubuntu-latest).
      - name: Shell scripts (bash -n, shellcheck)
        run: |
          set -euo pipefail
          scripts=()
          while IFS= read -r -d '' f; do
            if [[ "$f" == *.sh ]] || head -n 1 -- "$f" | grep -qE '^#!.*[/ ](ba|da)?sh( |$)'; then
              scripts+=("$f")
            fi
          done < <(git ls-files -z)
          if [[ ${#scripts[@]} -eq 0 ]]; then
            echo "no shell scripts"
            exit 0
          fi
          for f in "${scripts[@]}"; do bash -n "$f"; done
          shellcheck "${scripts[@]}"
