name: CI

# BASE-04. Added by scshafe-dev (the native kind). It runs
# dev.toml [verify] command (BASE-06): keep the two equal.
#
# No language, build system or platform is assumed. ubuntu-latest has common
# toolchains preinstalled (a C/C++ compiler, cmake, Python, Node, Go, Rust);
# add the setup your [verify] command needs before it (packages, an SDK, a
# toolchain action pinned by SHA). To build on other platforms, use a matrix
# of GitHub-hosted runners (macos-latest, windows-latest); dev check lists
# them (NATIVE-01). A release or store upload is a workflow of its own.
#
# This repository is private, so Actions does not run today (account billing):
# [verify] is run locally before every merge. The file is kept ready for when
# it does. macOS (hosted, 10x minutes on a private repository) runs by hand
# and weekly only.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * 1" # Mondays 07:17 UTC (the macOS job)

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Everything comes from PyPI or the repository itself (scshafe-qt is vendored):
# no package token, no cross-repository read. No microphone, network or server.
env:
  QT_QPA_PLATFORM: offscreen
  QT_QUICK_BACKEND: software

jobs:
  verify:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # The system libraries the PySide6 6.11 wheels link (as scshafe-qt's CI).
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libfreetype6 \
            libx11-6 libglib2.0-0t64 libdbus-1-3 fonts-dejavu-core
      - name: The vendored scshafe-qt wheel matches its Release's SHA256SUMS
        run: cd vendor && sha256sum -c --ignore-missing SHA256SUMS
      # astral-sh/setup-uv v10.2.0; uv's version from pyproject.toml, Python from .python-version.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
      - run: uv sync --frozen
      - name: Verify (dev.toml [verify] command)
        run: |
          uv run --frozen pytest -v && uv run --frozen voice-journey-capture --smoke

  macos:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: cd vendor && shasum -a 256 -c --ignore-missing SHA256SUMS
      # astral-sh/setup-uv v10.2.0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
      - run: uv sync --frozen
      - name: Verify (dev.toml [verify] command)
        run: |
          uv run --frozen pytest -v && uv run --frozen voice-journey-capture --smoke
