[project]
name = "voice-journey-capture"
version = "0.1.0"
description = "Voice Journey's capture client: the UMIK-1 session ritual, recorded as 48 kHz / 24-bit WAV, packaged with checksums and uploaded to the voice-journey intake (Pocket ID sign-in), built with scshafe-qt."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "voice-journey-capture contributors" }]
# scshafe-qt targets CPython 3.14 and PySide6 6.11.x.
requires-python = ">=3.14,<3.15"
classifiers = ["Private :: Do Not Upload", "Programming Language :: Python :: 3.14"]
dependencies = [
    # From PyPI (trusted publishing, PEP 740 attestations); uv.lock pins the
    # sha256, which matches the GitHub Release's SHA256SUMS. Upgrade per
    # docs/DEVELOPING.md.
    "scshafe-qt>=0.1.2,<0.2",
    "PySide6-Essentials>=6.11.2,<6.12",
    "httpx==0.28.1",
    "keyring==25.7.0",
    # PortAudio (CoreAudio on macOS, ALSA on Linux) for the raw 24-bit input
    # stream; QtMultimedia is not in PySide6-Essentials.
    "sounddevice==0.5.6",
]

[project.scripts]
voice-journey-capture = "voice_journey_capture.cli:main"

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-qt==4.5.0"]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_journey_capture"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
qt_api = "pyside6"
# Any Qt/QML warning (binding errors, unknown properties, ...) fails the test,
# except the macOS offscreen theme font one (see scshafe-qt's pyproject).
qt_log_level_fail = "WARNING"
qt_log_ignore = ["^Populating font family aliases took .* missing font family \"Sans Serif\""]

[tool.uv]
required-version = "==0.12.21"
