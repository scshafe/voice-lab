[build-system]
requires = ["setuptools==80.9.0", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "cole-voice-lab"
version = "0.1.0.dev0"
description = "Private, reproducible voice capture and local model evaluation infrastructure."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "voice-lab contributors" }]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "pydantic>=2.13.4,<3",
]

[project.optional-dependencies]
desktop = [
  "PySide6-Essentials==6.11.2",
]
# Library vault encryption; hash-locked with its closure in requirements/vault-macos.txt.
vault = [
  "cryptography==50.0.1",
]
dev = [
  "build>=1.2,<2",
  "setuptools==80.9.0",
  "wheel==0.46.3",
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<1",
  "PySide6-Essentials==6.11.2",
  "cryptography==50.0.1",
]

[project.scripts]
voice-lab = "cole_voice_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cole_voice_lab = ["py.typed", "resources/*"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["tests"]
# Port conformance suites are test modules too (tests/catalog_conformance.py, ...).
python_files = ["test_*.py", "*_conformance.py"]

[tool.coverage.run]
branch = true
source = ["cole_voice_lab"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.12"
# The app targets macOS: check its macOS branches on every host, Linux included.
platform = "darwin"
strict = true
packages = ["cole_voice_lab"]

[tool.ruff]
line-length = 100
target-version = "py312"
# legacy/voice-journey/ is the imported Node tree being ported (design §5.2, phase 3);
# its one Python file moves into the package, under these rules, when it is ported.
# apps/desktop/ is voice-journey-capture as imported (D-035); phase 4 brings it under them.
extend-exclude = ["legacy", "apps/desktop"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
