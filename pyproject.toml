[build-system]
requires = ["setuptools==80.9.0", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "cole-voice-lab"
version = "0.1.0.dev0"
description = "Private, reproducible voice capture and local model evaluation infrastructure."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "voice-lab contributors" }]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "pydantic>=2.13.4,<3",
]

[project.optional-dependencies]
desktop = [
  "PySide6-Essentials==6.11.2",
]
# Library vault encryption; hash-locked with its closure in requirements/vault-macos.txt.
vault = [
  "cryptography==50.0.1",
]
# The journey pipeline's frame analysis (design §5.3, phase 3); hash-locked for the home
# host in requirements/home-host-linux.txt. Only the job runner's modules import it.
journey = [
  "numpy==2.5.3",
]
dev = [
  # The locks pin 2.13.5; pydantic 2.14 changes TypeAdapter typing under strict mypy.
  "pydantic==2.13.5",
  "build>=1.2,<2",
  "setuptools==80.9.0",
  "wheel==0.46.3",
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<1",
  "PySide6-Essentials==6.11.2",
  "cryptography==50.0.1",
  # The sealing closure exactly as locked (tests/test_storage_sealing.py checks it).
  "cffi==2.1.1",
  "pycparser==3.0",
  "numpy==2.5.3",
  # The desktop app's closure (apps/desktop, D-037), so that scripts/verify checks and
  # tests it in this environment; its conftest puts apps/desktop/src on sys.path.
  "scshafe-qt==0.2.0",
  "httpx==0.28.1",
  "keyring==25.7.0",
  "sounddevice==0.5.6",
  "av==19.0.1",
  "pytest-qt==4.5.0",
]

[project.scripts]
voice-lab = "cole_voice_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cole_voice_lab = ["py.typed", "resources/*"]

[tool.pytest.ini_options]
# The desktop app's suite (apps/desktop/tests) runs on its own, with pytest-qt; this suite
# runs without it: its hooks call QApplication.instance() around every test, which breaks
# the tests here that stand in a fake application.
addopts = "--strict-config --strict-markers -ra -p no:pytest-qt"
# apps/mirror/tests: the macOS mirror sender (a separate, stdlib-only package; its
# conftest puts apps/mirror/src on sys.path, so it needs no install).
testpaths = ["tests", "apps/mirror/tests"]
# Port conformance suites are test modules too (tests/catalog_conformance.py, ...).
python_files = ["test_*.py", "*_conformance.py"]

[tool.coverage.run]
branch = true
source = ["cole_voice_lab"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.12"
# The app targets macOS: check its macOS branches on every host, Linux included.
platform = "darwin"
strict = true
packages = ["cole_voice_lab"]

# The desktop app's untyped dependencies (apps/desktop): scshafe-qt's Python surface is three
# functions; PortAudio's binding ships no types.
[[tool.mypy.overrides]]
module = ["scshafe_qt", "sounddevice"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"
# legacy/voice-journey/ is the imported Node tree being ported (design §5.2, phase 3);
# its one Python file moves into the package, under these rules, when it is ported.
extend-exclude = ["legacy"]
# Extensionless Python scripts Ruff would otherwise skip.
extend-include = ["scripts/journey-parity"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
