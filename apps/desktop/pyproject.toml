[build-system]
# The backend's build tool, at its pin (requirements/development-build.txt), so that
# scripts/verify builds this wheel offline with --no-isolation as it builds the backend's.
requires = ["setuptools==80.9.0", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-lab-desktop"
version = "0.1.0"
description = "voice-lab's desktop app: the corpus, the analysis and the referee over the lab's /api/v1, and the UMIK-1 measurement capture, signed in with Pocket ID; built with scshafe-qt."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "voice-lab contributors" }]
# voice-lab is Python 3.12 throughout (D-031); PySide6 6.11's abi3 wheels stop at 3.14.
requires-python = ">=3.12,<3.15"
classifiers = ["Private :: Do Not Upload", "Programming Language :: Python :: 3.12"]
dependencies = [
    # The /api/v1 contracts, the capture package and its validator, the home-host
    # approval and ledger (D-037): the backend distribution, whose own runtime
    # dependency is pydantic alone. From this repository (tool.uv.sources).
    "cole-voice-lab",
    # From PyPI (trusted publishing, PEP 740 attestations); uv.lock pins the sha256.
    "scshafe-qt>=0.2.0,<0.3",
    "PySide6-Essentials>=6.11.2,<6.12",
    "httpx==0.28.1",
    "keyring==25.7.0",
    # PortAudio (CoreAudio on macOS, ALSA on Linux): the raw 24-bit input stream of
    # the measurement capture, and the output of playback (QtMultimedia is not in
    # PySide6-Essentials).
    "sounddevice==0.5.6",
    # Playback (D-038): decode the served audio (AAC memos, WAV sessions) and shape it
    # (the referee's matched gain and 8 kHz low-pass) before PortAudio plays it.
    "av==19.0.1",
    "numpy==2.5.3",
]

[project.scripts]
voice-lab-desktop = "voice_lab_desktop.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
voice_lab_desktop = ["py.typed", "qml/*.qml", "qml/*/*.qml", "qml/*/*/*.qml", "qml/*/*/qmldir"]

[tool.uv]
required-version = ">=0.12.21"

[tool.uv.sources]
cole-voice-lab = { path = "../..", editable = true }

[dependency-groups]
dev = ["pytest>=8.3,<9", "pytest-qt==4.5.0", "pytest-cov>=6,<7"]

# scripts/verify runs this suite on its own (`pytest -c apps/desktop/pyproject.toml`):
# the backend's suite runs without pytest-qt, whose hooks call QApplication.instance()
# around every test and so break the backend's tests that stand in a fake application.
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers -ra"
qt_api = "pyside6"
# Any Qt/QML warning (binding errors, unknown properties, ...) fails the test,
# except the macOS offscreen theme font one (see scshafe-qt's pyproject).
qt_log_level_fail = "WARNING"
qt_log_ignore = ["^Populating font family aliases took .* missing font family \"Sans Serif\""]
markers = [
    "checklist(*ids): the docs/design/PHASE-4-CHECKLIST.md items this test ticks",
]

[tool.coverage.run]
branch = true
source = ["voice_lab_desktop"]

[tool.coverage.report]
show_missing = true
skip_covered = true
